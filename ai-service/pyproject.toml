[project]
name = "smart-fundis-ai"
version = "0.1.0"
description = "Smart Fundis AI pipeline: FastAPI service, LangGraph pipeline and eval, run on Brev."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langsmith>=0.14.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security)
    "ANN", # type annotations everywhere (AGENTS.md)
    "RUF", # ruff-specific
]
# Any is honest for trace payloads and decorator pass-through; annotations stay required.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and fake secrets are fine in tests

[tool.ruff.format]
quote-style = "double"

name: claude-review

# Claude reviews every PR against the project's rules. Branch protection on `main` requires this check.
# Setup: planning/prompts/00-setup-once.md (install the Claude GitHub App and add the secret).

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # If you use a Claude subscription instead, replace the line above with:
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            You are the Smart Fundis code reviewer. First read AGENTS.md, CONTEXT.md, docs/adr/,
            docs/superpowers/specs/2026-09-25-architecture-design.md and .claude/agents/code-reviewer.md.
            Find the ticket in the PR body ("Closes #N") and read it with `gh issue view N --comments`,
            along with its parent spec issue.

            Review the diff (`gh pr diff`) on two axes:
            1. Standards: AGENTS.md rules and non-negotiables. Every Convex function has a role guard; no role
               is read from arguments or Clerk metadata (ADR-18); no secrets in web/; no video URL from list
               queries or in logs; strings go through en.json (consent in en and sw); "verified", never
               "certified"; ADR-11 and ADR-19 rules run after the LLM; status changes match spec §5.
            2. Spec: every acceptance criterion in the ticket is implemented and tested at the seams named
               in the spec (§10). List any criterion with no test.

            Only report issues you can pin to file:line with a concrete failure scenario. No style nitpicks.
            Leave inline comments for specific issues, and one summary comment with a table:
            severity (blocker/major/minor) | file:line | issue | fix.

            Finally, write exactly one line to the file review-verdict.txt: "PASS" if there are no blocker
            or major findings, otherwise "FAIL: <count> blocker, <count> major".
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write(review-verdict.txt),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"

      - name: Gate on verdict
        run: |
          test -f review-verdict.txt || { echo "No verdict written"; exit 1; }
          cat review-verdict.txt
          grep -q '^PASS' review-verdict.txt
